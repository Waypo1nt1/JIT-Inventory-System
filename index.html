<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Калькулятор JIT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="theme-switch-btn" class="theme-switch-btn">Сменить тему</button>

  <div class="logistics-panel"> 
    <div class="calc-header">Расчет поставок</div> 
    
    <div id="capacity-display" class="capacity-display">
      0
    </div>

    <div>
      <div>  
        <button id="stock_op_clear" class="stock-btn secondary">C</button>
        <button id="stock_op_sign" class="stock-btn secondary">+/-</button>
        <button id="stock_op_percent" class="stock-btn secondary">%</button>
        <button id="stock_op_div" class="stock-btn primary">/</button>
      </div>

      <div>
        <button id="stock_digit_7" class="stock-btn">7</button>
        <button id="stock_digit_8" class="stock-btn">8</button>
        <button id="stock_digit_9" class="stock-btn">9</button>
        <button id="stock_op_mult" class="stock-btn primary">x</button>
      </div>

      <div>
        <button id="stock_digit_4" class="stock-btn">4</button>
        <button id="stock_digit_5" class="stock-btn">5</button>
        <button id="stock_digit_6" class="stock-btn">6</button>
        <button id="stock_op_minus" class="stock-btn primary">-</button>
      </div>

      <div>
        <button id="stock_digit_1" class="stock-btn">1</button>
        <button id="stock_digit_2" class="stock-btn">2</button>
        <button id="stock_digit_3" class="stock-btn">3</button>
        <button id="stock_op_plus" class="stock-btn primary">+</button>
      </div>

      <div>
        <button id="stock_digit_0" class="stock-btn">0</button>
        <button id="stock_digit_dot" class="stock-btn">.</button>
        <button id="stock_op_equal" class="stock-btn primary execute">=</button>
      </div>
    </div>
  </div>

  <div class="info-panel">
    
    <select class="warehouse-select">
      <option value="main">Главный склад (Москва)</option>
      <option value="reserve">Резервный склад (СПб)</option>
    </select>

    <details class="author-details">
      <summary class="author-summary">Информация об авторе</summary>
      
      <p class="author-text">ЛР выполнена Поповым А.С.</p>
      <p class="author-text">Группа ИУ5-41Б</p>
      
      <p class="author-text">Цель данной лабораторной работы - <mark>знакомство</mark> с инструментами построения пользовательских интерфейсов web-сайтов: <mark>HTML</mark>, <mark>CSS</mark>.</p>
      
      <a href="https://github.com/Waypo1nt1" target="_blank" class="github-link">Мой GitHub</a>
    </details>

  </div>

  <script>
    document.getElementById('theme-switch-btn').onclick = function() {
      document.body.classList.toggle('dark-theme');
    };
  </script>
</body>
</html>
